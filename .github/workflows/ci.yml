name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.16.3
      - name: ruff check
        run: ruff check qsha256/ tests/ scripts/ examples/ --output-format=github
      - name: ruff format
        run: ruff format --check qsha256/ tests/ scripts/ examples/

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The full 64-round circuits are built in the `slow` tests only, so normal
      # CI stays fast. The nightly workflow runs everything.
      - name: pytest (excluding slow)
        run: pytest tests/ -q -m "not slow" --cov=qsha256 --cov-report=term-missing
      - name: validation suite (quick)
        run: qsha256 validate --quick

  prove:
    name: formal proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # UNSAT here is a proof over every input, not a sample.
      - name: prove primitives and the round function
        run: qsha256 prove --scope standard
      - name: 16 registers suffice for the message schedule, 15 do not
        run: qsha256 pebble --steps 48 --timeout 120

  claims:
    name: claims register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Every headline number in README and docs/claims.md is re-derived from
      # the code here. Documentation that has drifted away from the circuit
      # fails the build, which is the only thing that keeps a claims register
      # honest over time.
      - name: re-derive every claim
        run: python scripts/reproduce.py --json claims.json
      - name: the qualifications survive too, not just the numbers
        run: pytest tests/test_claims.py -q
      # Rebuilds Amy et al. 2016 from their published figures and compares.
      # A change that makes their round suddenly reproduce is a change that
      # needs the claims register updated, so it fails here first.
      - name: rebuild the published baseline
        run: qsha256 baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claims
          path: claims.json

  regression:
    name: resource regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Fails the build if T-count, qubits or depth regress against the
      # committed baseline. Optimization claims are easy to lose silently.
      - name: check against baseline
        run: python scripts/check_regression.py

  crosscheck:
    name: independent estimators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: install a third-party estimator
        run: pip install "qsha256[interop]" || pip install qualtran
        continue-on-error: true
      - name: compare gate counts against Qualtran and a QASM-text counter
        run: qsha256 crosscheck --spec sha256 --rounds 4

  full-scale:
    name: full-scale 64-round verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The headline claim: the real 32-bit, 64-round circuit reproduces hashlib.
      - name: slow tests
        run: pytest tests/ -q -m "slow"
      - name: full validation suite
        run: qsha256 validate
      - name: SHA-512 and SHA-3
        run: |
          qsha256 analyze --spec sha512 --rounds 80 --no-transpile
          python -c "import hashlib; from qsha256.quantum.keccak.keccak import sha3_256; assert sha3_256(b'abc') == hashlib.sha3_256(b'abc').digest()"

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: run every example
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f" > /dev/null
            echo "::endgroup::"
          done

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
