name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.16.3
      - name: ruff check
        run: ruff check qsha256/ tests/ scripts/ examples/ --output-format=github
      - name: ruff format
        run: ruff format --check qsha256/ tests/ scripts/ examples/

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The full 64-round circuits are built in the `slow` tests only, so normal
      # CI stays fast. The nightly workflow runs everything.
      - name: pytest (excluding slow)
        run: pytest tests/ -q -m "not slow" --cov=qsha256 --cov-report=term-missing
      - name: validation suite (quick)
        run: qsha256 validate --quick

  full-scale:
    name: full-scale 64-round verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The headline claim: the real 32-bit, 64-round circuit reproduces hashlib.
      - name: slow tests
        run: pytest tests/ -q -m "slow"
      - name: full validation suite
        run: qsha256 validate

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: run every example
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f" > /dev/null
            echo "::endgroup::"
          done

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
